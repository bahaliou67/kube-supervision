# Publie la page d'accueil (dossier site/) sur GitHub Pages :
# https://bahaliou67.github.io/kube-supervision/
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

# Un seul déploiement à la fois ; celui en cours n'est pas annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write     # publier sur GitHub Pages
      id-token: write  # prouver l'identité du workflow auprès de Pages
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      # Actions figées sur un commit (SHA) : une version modifiée après coup ne peut pas s'exécuter ici.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
