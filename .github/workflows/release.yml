# Publie une version : `npm version minor -m "Version %s"` puis `git push --follow-tags`.
# Construit un exécutable autonome par plateforme, atteste sa provenance et crée la Release GitHub.
name: Release

on:
  push:
    tags: ['v*']

# Rien par défaut : chaque job demande seulement ce dont il a besoin.
permissions: {}

jobs:
  executables:
    permissions:
      contents: read
      actions: read  # SignPath lit les détails du job et télécharge l'artefact à signer
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            fichier: kube-supervision-win-x64.exe
          - runner: macos-latest
            fichier: kube-supervision-macos-arm64
          - runner: macos-15-intel
            fichier: kube-supervision-macos-x64
          - runner: ubuntu-latest
            fichier: kube-supervision-linux-x64
          - runner: ubuntu-24.04-arm
            fichier: kube-supervision-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # Actions figées sur un commit (SHA) : une version modifiée après coup ne peut pas s'exécuter ici.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Le tag correspond à la version du package
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de package.json"
            exit 1
          fi
          echo "valeur=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - name: Fumée — l'exécutable démarre
        shell: bash
        run: ./build-exe/${{ matrix.fichier }} --version
      - id: televersement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.fichier }}
          path: build-exe/${{ matrix.fichier }}
          if-no-files-found: error

      # Signature de l'exécutable Windows par SignPath Foundation, active une fois le projet
      # accepté et configuré (variable SIGNPATH_ORGANIZATION_ID, secret SIGNPATH_API_TOKEN).
      # Chaque demande doit être approuvée à la main dans SignPath : le job attend au plus 2 h.
      - name: Signature Windows (SignPath)
        if: matrix.runner == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kube-supervision
          signing-policy-slug: release-signing
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.televersement.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.valeur }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signe
      - name: Vérification de la signature
        if: matrix.runner == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signe/${{ matrix.fichier }}
          if ($signature.Status -ne 'Valid') { throw "Signature invalide : $($signature.Status)" }
          $signature.SignerCertificate.Subject
          ./signe/${{ matrix.fichier }} --version
      - name: Remplacement par l'exécutable signé
        if: matrix.runner == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.fichier }}
          path: signe/${{ matrix.fichier }}
          if-no-files-found: error
          overwrite: true

  release:
    needs: executables
    runs-on: ubuntu-latest
    permissions:
      contents: write      # créer la Release
      id-token: write      # signer l'attestation (identité OIDC du workflow)
      attestations: write  # enregistrer l'attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: fichiers
          merge-multiple: true
      - name: Sommes de contrôle
        working-directory: fichiers
        run: sha256sum kube-supervision-* > SHA256SUMS.txt
      # Preuve signée que chaque exécutable a été construit par ce workflow, à partir de ce commit.
      # Vérification : gh attestation verify <fichier> --repo bahaliou67/kube-supervision
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fichiers/kube-supervision-*
      - name: Création de la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fichiers/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
